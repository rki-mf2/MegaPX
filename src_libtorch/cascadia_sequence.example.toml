[model]
# Use a TorchScript export for C++ inference, for example a .pt file saved with
# torch.jit.save(...). A Python/Lightning .ckpt can be inspected, but not run
# directly by LibTorch.
path = "../model/cascadia_sequence.pt"
tokenizer = "massivekb"
modifications_path = ""

# Values mirrored from cascadia/cascadia/cascadia.py sequence().
d_model = 512
n_layers = 9
n_head = 8
dim_feedforward = 1024
dropout = 0
rt_width = 2
max_charge = 10

[runtime]
device = "cpu"

[sequence]
spectrum_path = "../cascadia/demo.mzML"
batch_size = 32
augmentation_width = 2
candidate_max_charge = 4
scan_width = 1
top_n_peaks = 150
max_sequence_length = 64
score_threshold = 0.8
